name: Source checks
on:
  - pull_request
  - workflow_dispatch
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust formatting tools
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/lib/*.sh
# Rust compilation, tests and Clippy run on the configured private rust-builder.
# See BUILDING.md; this public runner has no access to that builder.

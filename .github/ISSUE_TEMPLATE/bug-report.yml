name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: How is this bug occurring?
    validations:
      required: true
  - type: dropdown
    id: installation-source
    attributes:
      label: Installation Source
      description: Where did you install Celestial from?
      options:
        - Portable executable
        - Built from source
        - Other (specify the source in the bug description above)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: What version of Celestial are you using?
      description: Run `celestial --version` to find it.
    validations:
      required: true
  - type: dropdown
    id: remote-type
    attributes:
      label: Storage Provider
      description: If your issue is happening in relation to a specific cloud provider, specify it below.
      options:
        - Dropbox
        - Google Drive
        - Nextcloud
        - Owncloud
        - pCloud
        - Proton Drive
        - WebDAV
    validations:
      required: true

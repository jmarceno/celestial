[package]
name = "celeste"
version = "0.8.3"
edition = "2024"
description = "Folder sync for the cloud providers rclone supports"
rust-version = "1.85"
build = "build.rs"

[lib]
name = "celeste"
path = "src/lib.rs"

[[bin]]
name = "celeste"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.20", features = ["derive"] }
crossbeam-channel = { version = "=0.5.15" }
cxx = { version = "=1.0.176" }
cxx-qt = { version = "=0.10.0" }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
directories = { version = "=5.0.1" }
file-lock = "=2.1.11"
futures = "=0.3.30"
glob = "=0.3.1"
indexmap = "=1.9.3"
ksni = "=0.2.2"
librclone = "=0.6.3"
nix = "=0.26.4"
regex = "=1.10.5"
rocket = "=0.5.1"
sea-orm = { version = "=0.10.7", features = ["sqlx-sqlite", "runtime-async-std-rustls", "macros"] }
sea-orm-migration = "=0.10.7"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tera = "=1.20.0"
time = { version = "=0.3.36", features = ["serde-well-known"] }
tokio = { version = "=1.38.0", features = ["macros", "rt-multi-thread", "sync"] }
tracing = { version = "=0.1.41" }
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
tr = "=0.1.7"
url = "=2.5.2"
zbus = { version = "=4.4.0", features = ["blocking"] }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }
# cxx-qt 0.10 generates Rust exports for cxx 1.0.176. A newer cxx-gen
# puts those symbols in a versioned inline namespace and the link fails.
cxx-gen = "=0.7.176"

[dev-dependencies]
tempfile = { version = "=3.15.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
warnings = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "deny"
complexity = "deny"
perf = "deny"
